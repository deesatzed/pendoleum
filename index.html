<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal Layer Pendulum – New Music Engine v3</title>
<style>
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; padding:0 10px; background:#0a0a14; color:#d0d0ff; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow-x:hidden; }
  h1 { margin:10px 0 2px; font-size:1.5em; }
  .sub { opacity:.65; font-size:13px; margin-bottom:8px; }
  canvas { display:block; width:min(920px, 100%); height:auto; background:#10102a; border-radius:14px; box-shadow:0 0 50px rgba(120,100,255,.12); }
  .panel { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:8px; width:min(100%, 960px); }
  select, button, input { padding:7px 11px; border-radius:7px; border:none; background:#1c1c3a; color:#fff; font-size:13px; }
  button { background:#6c5ce7; cursor:pointer; }
  button:hover { background:#a29bfe; }
  button.danger { background:#c0392b; }
  button.danger:hover { background:#e74c3c; }
  button.recording { background:#e17055; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .75; } }
  .layer-row { display:flex; flex-wrap:wrap; align-items:center; gap:5px; max-width:100%; background:#161632; padding:5px 9px; border-radius:7px; font-size:12px; }
  .layer-row select, .layer-row input { font-size:12px; padding:5px 7px; }
  .layer-row .tag { opacity:.55; font-size:10px; margin-left:2px; }
  #status { font-size:12px; opacity:.75; margin:6px 0 10px; text-align:center; max-width:920px; word-break:break-word; }
  .section { background:#12122a; padding:8px 12px; border-radius:10px; margin:4px; }
  label { display:inline-flex; align-items:center; gap:4px; }
  button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline:2px solid #a29bfe; outline-offset:2px; }
  @media (max-width:640px) {
    body { padding:0 4px; }
    .panel { padding:5px 0; }
    .layer-row, .section { width:100%; justify-content:center; }
    .layer-row select { max-width:calc(100vw - 90px); }
  }
</style>
</head>
<body>
  <h1>Modal Layer Pendulum – Generative Engine</h1>
  <div class="sub">Per layer: mode · key · oct · speed · order (↑/↓) · notes (count) · JI · MIDI · evolve</div>

  <div class="panel" id="layersPanel" role="group" aria-label="Modal layers"></div>

  <div class="panel">
    <div class="section">
      <button id="addLayerBtn" onclick="addLayer()">+ Layer</button>
      <button id="restartBtn" onclick="restart()">Restart</button>
      <button onclick="togglePause()" id="pauseBtn">Pause</button>
      <label>Default notes <input type="number" id="numPerLayer" value="7" min="1" max="12" style="width:42px" title="Default note count for new layers" aria-label="Default note count for new layers" onchange="onDefaultNotesChange()"></label>
    </div>

    <div class="section">
      <button onclick="toggleAudio()" id="audioBtn">Start Sound</button>
      <button onclick="stopAll()" id="stopBtn" class="danger">Stop</button>
      <label><span aria-hidden="true">Vol</span> <input type="range" id="volSlider" min="0" max="100" value="55" aria-label="Master volume" oninput="setMasterVolume(+this.value/100)" style="width:90px; vertical-align:middle"></label>
    </div>

    <div class="section">
      <button onclick="toggleRecord()" id="recBtn">Record</button>
      <a id="downloadLink" style="display:none"></a>
    </div>

    <div class="section">
      <label><input type="checkbox" id="jiToggle" aria-label="Just Intonation" onchange="restart()"> Just Intonation</label>
    </div>

    <div class="section">
      <button onclick="enableMIDI()" id="midiBtn">Enable MIDI</button>
      <select id="midiOut" aria-label="MIDI output device" style="max-width:160px"></select>
    </div>

    <div class="section">
      <button id="evolveBtn" onclick="evolveOnce()">Evolve Once</button>
      <button onclick="overnightBreed()" id="breedBtn">Simulate Overnight Breeding</button>
      <button onclick="cancelBreed()" id="cancelBreedBtn" class="danger" style="display:none">Cancel Breed</button>
      <label>Gens <input type="number" id="gens" value="40" min="5" max="200" style="width:60px" aria-label="Breeding generations"></label>
    </div>
  </div>

  <canvas id="c" width="920" height="600" role="img" tabindex="0" aria-label="Animated layered pendulum visualization">Pendoleum animated pendulum visualization.</canvas>
  <div id="status" role="status" aria-live="polite" aria-atomic="true">Stack modes → Start Sound → Record to save → Stop to silence. Chromium recommended.</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Equal temperament
const et = {C:1, 'C#':1.0595, D:1.1225, Eb:1.1892, E:1.2599, F:1.3348, 'F#':1.4142, G:1.4983, Ab:1.5874, A:1.6818, Bb:1.7818, B:1.8877};

// Just Intonation (5-limit) ratios for modes
const jiModes = {
  ionian:     [1/1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8],
  dorian:     [1/1, 9/8, 6/5, 4/3, 3/2, 5/3, 9/5],
  phrygian:   [1/1, 16/15, 6/5, 4/3, 3/2, 8/5, 9/5],
  lydian:     [1/1, 9/8, 5/4, 45/32, 3/2, 5/3, 15/8],
  mixolydian: [1/1, 9/8, 5/4, 4/3, 3/2, 5/3, 16/9],
  aeolian:    [1/1, 9/8, 6/5, 4/3, 3/2, 8/5, 9/5],
  locrian:    [1/1, 16/15, 6/5, 4/3, 64/45, 8/5, 16/9],
  hirajoshi:  [1/1, 9/8, 6/5, 3/2, 8/5],
  major_penta:[1/1, 9/8, 5/4, 3/2, 5/3],
  minor_penta:[1/1, 6/5, 4/3, 3/2, 9/5],
  blues:      [1/1, 6/5, 4/3, 7/5, 3/2, 9/5],
  whole_tone: [1/1, 9/8, 5/4, 36/25, 8/5, 9/5]
};

const etModes = {
  ionian: ['C','D','E','F','G','A','B'],
  dorian: ['C','D','Eb','F','G','A','Bb'],
  phrygian: ['C','Db','Eb','F','G','Ab','Bb'],
  lydian: ['C','D','E','F#','G','A','B'],
  mixolydian: ['C','D','E','F','G','A','Bb'],
  aeolian: ['C','D','Eb','F','G','Ab','Bb'],
  locrian: ['C','Db','Eb','F','Gb','Ab','Bb'],
  hirajoshi: ['C','D','Eb','G','Ab'],
  major_penta: ['C','D','E','G','A'],
  minor_penta: ['C','Eb','F','G','Bb'],
  blues: ['C','Eb','F','F#','G','Bb'],
  whole_tone: ['C','D','E','F#','Ab','Bb']
};

const modeColors = [[190,65],[280,70],[35,80],[320,60],[130,55],[200,50]];

const MAX_LAYERS = 5;
/** getFreqs normalizes the lowest ratio to this unit (physics). */
const REL_UNIT = 0.36;
/** Map REL_UNIT → this Hz so pitches sit in an audible midrange (not sub-bass). */
const AUDIO_BASE_HZ = 196;
const VOICE_PEAK = 0.11;
const DEFAULT_MASTER = 0.55;

let layers = [];
let time = 0;
let audioCtx = null, masterGain = null, isAudioOn = false;
let midiAccess = null, midiOutput = null;
let population = []; // genetic population
let customModes = {}; // evolved ratio scales (local SOT)
let isPaused = false;
let mediaDest = null;
let mediaRecorder = null;
let recordChunks = [];
let isRecording = false;
let breedCancel = false;
let breedRunning = false;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function relToHz(rel) {
  return AUDIO_BASE_HZ * (rel / REL_UNIT);
}

function stopPendulumAudio(p) {
  if (!p) return;
  try { if (p.osc) { p.osc.stop(); p.osc.disconnect(); } } catch (e) {}
  try { if (p.gain) p.gain.disconnect(); } catch (e) {}
  p.osc = null;
  p.gain = null;
}

function stopAllOscillators() {
  layers.forEach(layer => {
    (layer.pendulums || []).forEach(stopPendulumAudio);
  });
}

function masterVolumeFromUI() {
  const slider = document.getElementById('volSlider');
  return slider ? Math.max(0, Math.min(1, +slider.value / 100)) : DEFAULT_MASTER;
}

function setMasterVolume(v01) {
  if (!masterGain || !audioCtx) return;
  // While stopped/muted, keep bus silent — slider value is applied on next Start Sound.
  if (!isAudioOn) return;
  const v = Math.max(0, Math.min(1, v01));
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
}

const KEY_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
/**
 * Swing-rate factors as exact rationals (num/den) so speeds stay
 * factorable without remainder. Includes very slow rates so each peak is audible.
 */
const SPEED_OPTIONS = [
  { id: '1/8', num: 1, den: 8, label: '×1/8 very slow' },
  { id: '1/6', num: 1, den: 6, label: '×1/6' },
  { id: '1/4', num: 1, den: 4, label: '×1/4 slow' },
  { id: '1/3', num: 1, den: 3, label: '×1/3' },
  { id: '1/2', num: 1, den: 2, label: '×1/2' },
  { id: '1',   num: 1, den: 1, label: '×1' },
  { id: '2',   num: 2, den: 1, label: '×2' },
  { id: '3',   num: 3, den: 1, label: '×3' },
  { id: '4',   num: 4, den: 1, label: '×4' },
  { id: '6',   num: 6, den: 1, label: '×6' },
  { id: '8',   num: 8, den: 1, label: '×8 fast' }
];
const OCTAVE_OPTIONS = [-2, -1, 0, 1, 2];

function parseSpeed(speed) {
  if (speed && typeof speed === 'object' && speed.num != null) {
    return { num: Math.max(1, speed.num | 0), den: Math.max(1, speed.den | 0) };
  }
  // legacy integer speeds
  if (typeof speed === 'number' && Number.isFinite(speed)) {
    return { num: Math.max(1, Math.round(speed)), den: 1 };
  }
  const s = String(speed == null ? '1/4' : speed);
  if (s.includes('/')) {
    const [a, b] = s.split('/');
    return { num: Math.max(1, parseInt(a, 10) || 1), den: Math.max(1, parseInt(b, 10) || 1) };
  }
  const n = parseInt(s, 10);
  return { num: Math.max(1, n || 1), den: 1 };
}

function speedId(speed) {
  const { num, den } = parseSpeed(speed);
  return den === 1 ? String(num) : `${num}/${den}`;
}

function speedFactor(speed) {
  const { num, den } = parseSpeed(speed);
  return num / den;
}

function speedLabel(speed) {
  const id = speedId(speed);
  const opt = SPEED_OPTIONS.find(o => o.id === id);
  return opt ? opt.label : `×${id}`;
}

function defaultNotesFromUI() {
  const el = document.getElementById('numPerLayer');
  const n = el ? (+el.value || 7) : 7;
  return Math.max(1, Math.min(12, n));
}

/**
 * order:
 *  - 'asc'  scale low→high (default)
 *  - 'desc' reversed high→low (does NOT remove pendulums; same ratios, mirrored assignment)
 * notes: how many pendulums/degrees to keep (remove notes by lowering this)
 */
function defaultLayer(mode) {
  return {
    mode: mode || 'ionian',
    key: 'C',
    octave: 0,
    speed: '1/4', // default slow enough to hear each peak as a note
    order: 'asc',
    notes: defaultNotesFromUI(),
    pendulums: [],
    weights: []
  };
}

function onDefaultNotesChange() {
  // Only updates layers that still track the default (optional: apply to all without custom)
  // Leave existing layer.notes as-is; new layers pick up the new default.
  setStatus('Default notes set to ' + defaultNotesFromUI() + ' (existing layers keep their own note counts)');
}

function freeLayerSlots() {
  return Math.max(0, MAX_LAYERS - layers.length);
}

/** Store scale always; add as layer only if under cap. Returns whether a layer was added. */
function injectModeAsLayer(name, scale) {
  customModes[name] = scale;
  if (freeLayerSlots() === 0) return false;
  layers.push(defaultLayer(name));
  return true;
}

function setLayerField(i, field, value) {
  const layer = layers[i];
  if (!layer) return;
  if (field === 'mode') layer.mode = value;
  else if (field === 'key') layer.key = value;
  else if (field === 'octave') layer.octave = +value;
  else if (field === 'speed') layer.speed = speedId(value);
  else if (field === 'order') layer.order = value === 'desc' ? 'desc' : 'asc';
  else if (field === 'notes') layer.notes = Math.max(1, Math.min(12, +value || 1));
  restart();
}

function createLayerUI() {
  const panel = document.getElementById('layersPanel');
  panel.innerHTML = '';
  layers.forEach((layer, i) => {
    if (layer.key == null) layer.key = 'C';
    if (layer.octave == null) layer.octave = 0;
    if (layer.speed == null) layer.speed = '1/4';
    if (layer.order == null) layer.order = 'asc';
    if (layer.notes == null) layer.notes = defaultNotesFromUI();
    const curSpd = speedId(layer.speed);
    const row = document.createElement('div');
    row.className = 'layer-row';
    const opts = Object.keys(etModes).concat(Object.keys(jiModes).filter(k=>!etModes[k])).concat(
      Object.keys(customModes)
    );
    const keyOpts = KEY_NAMES.map(k =>
      `<option value="${k}" ${k===layer.key?'selected':''}>${k}</option>`).join('');
    const octOpts = OCTAVE_OPTIONS.map(o =>
      `<option value="${o}" ${o===layer.octave?'selected':''}>${o >= 0 ? '+'+o : o}</option>`).join('');
    const spdOpts = SPEED_OPTIONS.map(s =>
      `<option value="${s.id}" ${s.id===curSpd?'selected':''}>${s.label}</option>`).join('');
    const noteOpts = Array.from({ length: 12 }, (_, k) => k + 1).map(n =>
      `<option value="${n}" ${n===layer.notes?'selected':''}>${n}</option>`).join('');
    row.innerHTML = `
      <span style="color:hsl(${modeColors[i%modeColors.length][0]},70%,70%)">L${i+1}</span>
      <select onchange="setLayerField(${i},'mode',this.value)" title="Mode / scale">
        ${opts.map(m => `<option value="${m}" ${m===layer.mode?'selected':''}>${m}</option>`).join('')}
      </select>
      <span class="tag">key</span>
      <select onchange="setLayerField(${i},'key',this.value)" title="Key / root">${keyOpts}</select>
      <span class="tag">oct</span>
      <select onchange="setLayerField(${i},'octave',this.value)" title="Octave">${octOpts}</select>
      <span class="tag">spd</span>
      <select onchange="setLayerField(${i},'speed',this.value)" title="Swing speed (exact rational factor)">${spdOpts}</select>
      <span class="tag">order</span>
      <select onchange="setLayerField(${i},'order',this.value)" title="Note order — reverse does not remove pendulums">
        <option value="asc" ${layer.order!=='desc'?'selected':''}>low→high</option>
        <option value="desc" ${layer.order==='desc'?'selected':''}>high→low</option>
      </select>
      <span class="tag">notes</span>
      <select onchange="setLayerField(${i},'notes',this.value)" title="How many notes/pendulums (remove notes by lowering)">${noteOpts}</select>
      <button onclick="removeLayer(${i})" title="Remove layer">×</button>`;
    panel.appendChild(row);
  });
}

function addLayer() {
  if (layers.length >= MAX_LAYERS) return;
  const keys = Object.keys(etModes);
  layers.push(defaultLayer(keys[layers.length % keys.length]));
  createLayerUI();
  restart();
}
function removeLayer(i) {
  layers.splice(i,1);
  createLayerUI();
  restart();
}

/** Greatest common divisor (positive integers). */
function gcd(a, b) {
  a = Math.abs(a | 0); b = Math.abs(b | 0);
  while (b) { const t = b; b = a % b; a = t; }
  return a || 1;
}

function gcdAll(nums) {
  return nums.reduce((g, x) => gcd(g, x), nums[0] || 1);
}

/**
 * Map floating ratios → smallest positive integers with the same relative spacing
 * (within rounding). That makes swing rates factorable with no remainder:
 * a common period exists where every pendulum returns to phase together.
 */
function ratiosToIntegerWeights(ratios) {
  if (!ratios || !ratios.length) return [1];
  const minR = Math.min(...ratios.filter(r => r > 0));
  if (!(minR > 0)) return ratios.map(() => 1);
  // Highly composite scale so pure JI fractions land on exact integers (e.g. ×24 → 24,27,30…).
  const BIG = 10080;
  let ints = ratios.map(r => Math.max(1, Math.round((r / minR) * BIG)));
  const g = gcdAll(ints);
  return ints.map(i => i / g);
}

/** Exact scale degrees only — no linear blend between degrees (blends break integer ratios). */
function modeRatioList(modeName, useJI) {
  if (useJI && jiModes[modeName]) return jiModes[modeName].slice();
  if (customModes[modeName]) return customModes[modeName].slice();
  const notes = etModes[modeName] || etModes.ionian;
  return notes.map(note => et[note]);
}

/**
 * Build n pendulum frequency units from a mode.
 * - Integer weights stay commensurate (factorable without remainders).
 * - order 'asc'|'desc': reverse note assignment without losing pendulums —
 *   same pitch set, mirrored degree order (each bob still has its own length/rate).
 * - n = how many notes to keep (remove notes by using a smaller n).
 * - Extra pendulums beyond scale length stack octaves via ×2.
 */
function getFreqPlan(modeName, n, useJI, key, octave, layerSpeed, order) {
  const baseRatios = modeRatioList(modeName, useJI);
  let degreeWeights = ratiosToIntegerWeights(baseRatios);
  // Reverse only reorders assignment — does not drop the pendulum physics.
  if (order === 'desc') degreeWeights = degreeWeights.slice().reverse();

  const count = Math.max(1, Math.min(12, n | 0 || 1));
  const weights = [];
  for (let i = 0; i < count; i++) {
    const degree = i % degreeWeights.length;
    const octaves = Math.floor(i / degreeWeights.length);
    weights.push(degreeWeights[degree] * (2 ** octaves));
  }
  const minW = Math.min(...weights);
  const keyRatio = et[key] || 1; // relative to C
  const octMul = Math.pow(2, octave || 0);
  const pitchMul = keyRatio * octMul;
  const rel = weights.map(w => (w / minW) * REL_UNIT * pitchMul);
  return { rel, weights, pitchMul, layerSpeed: speedId(layerSpeed), order: order === 'desc' ? 'desc' : 'asc' };
}

/** Back-compat: relative physics frequencies only. */
function getFreqs(modeName, n, useJI) {
  return getFreqPlan(modeName, n, useJI, 'C', 0, '1', 'asc').rel;
}

function initAudio() {
  if (audioCtx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) {
    setStatus('Web Audio not available in this browser');
    return false;
  }
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  const slider = document.getElementById('volSlider');
  masterGain.gain.value = slider ? (+slider.value / 100) : DEFAULT_MASTER;
  masterGain.connect(audioCtx.destination);
  // Tap for MediaRecorder (save)
  mediaDest = audioCtx.createMediaStreamDestination();
  masterGain.connect(mediaDest);
  return true;
}

async function ensureAudioRunning() {
  if (!initAudio()) return false;
  if (audioCtx.state === 'suspended') {
    try {
      await audioCtx.resume();
    } catch (e) {
      setStatus('Audio blocked – click Start Sound again after interacting with the page');
      return false;
    }
  }
  return audioCtx.state === 'running' || audioCtx.state === 'suspended';
}

function wirePendulumOsc(p) {
  if (!audioCtx || !masterGain) return;
  p.osc = audioCtx.createOscillator();
  p.gain = audioCtx.createGain();
  p.osc.type = 'sine';
  // p.f already scaled by key/octave; relToHz maps REL_UNIT→AUDIO_BASE but f may be > REL_UNIT*pitch
  // Use absolute: hz = AUDIO_BASE_HZ * (f / REL_UNIT) which works for any positive f.
  p.osc.frequency.value = AUDIO_BASE_HZ * (p.f / REL_UNIT);
  p.gain.gain.value = 0;
  p.osc.connect(p.gain);
  p.gain.connect(masterGain);
  p.osc.start();
}

function hardSilenceBus() {
  // Zero every voice, tear down oscillators, hold master at 0 (do NOT auto-restore).
  layers.forEach(layer => {
    (layer.pendulums || []).forEach(p => {
      if (p.gain && audioCtx) {
        try {
          p.gain.gain.cancelScheduledValues(audioCtx.currentTime);
          p.gain.gain.setValueAtTime(0, audioCtx.currentTime);
        } catch (e) {}
      }
      stopPendulumAudio(p);
    });
  });
  if (masterGain && audioCtx) {
    try {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
    } catch (e) {}
  }
}

async function toggleAudio() {
  const turningOn = !isAudioOn;
  if (turningOn) {
    const ok = await ensureAudioRunning();
    if (!ok) {
      isAudioOn = false;
      document.getElementById('audioBtn').textContent = 'Start Sound';
      return;
    }
    isAudioOn = true;
    isPaused = false;
    document.getElementById('pauseBtn').textContent = 'Pause';
    document.getElementById('audioBtn').textContent = 'Mute';
    // Restore level from slider, then build oscillators.
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterVolumeFromUI(), audioCtx.currentTime);
    }
    layers.forEach(layer => {
      (layer.pendulums || []).forEach(p => {
        stopPendulumAudio(p);
        wirePendulumOsc(p);
      });
    });
    setStatus(`Sound on · Stop = silence + freeze · per-layer key/oct/spd available`);
  } else {
    // Mute: hard silence, keep motion running
    isAudioOn = false;
    document.getElementById('audioBtn').textContent = 'Start Sound';
    hardSilenceBus();
    setStatus('Muted (motion continues). Start Sound to hear again.');
  }
}

function stopAll() {
  // Full stop: silence audio, freeze motion, suspend context. Master stays at 0 until Start.
  isAudioOn = false;
  document.getElementById('audioBtn').textContent = 'Start Sound';
  hardSilenceBus();
  isPaused = true;
  document.getElementById('pauseBtn').textContent = 'Resume';
  if (isRecording) stopRecording(true);
  if (audioCtx && audioCtx.state === 'running') {
    audioCtx.suspend().catch(() => {});
  }
  setStatus('Stopped — silent & frozen. Click Start Sound (or Resume for motion only).');
}

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
  setStatus(isPaused ? 'Paused (motion + note peaks held)' : 'Resumed');
}

function toggleRecord() {
  if (isRecording) stopRecording(false);
  else startRecording();
}

async function startRecording() {
  const ok = await ensureAudioRunning();
  if (!ok || !mediaDest) {
    setStatus('Cannot record — Web Audio unavailable');
    return;
  }
  if (!isAudioOn) {
    // Auto-start sound so recording is not silent
    isAudioOn = true;
    isPaused = false;
    document.getElementById('pauseBtn').textContent = 'Pause';
    document.getElementById('audioBtn').textContent = 'Mute';
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterVolumeFromUI(), audioCtx.currentTime);
    }
    layers.forEach(layer => {
      (layer.pendulums || []).forEach(p => {
        stopPendulumAudio(p);
        wirePendulumOsc(p);
      });
    });
  }
  if (typeof MediaRecorder === 'undefined') {
    setStatus('MediaRecorder not supported in this browser');
    return;
  }
  recordChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
  try {
    mediaRecorder = mime
      ? new MediaRecorder(mediaDest.stream, { mimeType: mime })
      : new MediaRecorder(mediaDest.stream);
  } catch (e) {
    setStatus('MediaRecorder not supported in this browser');
    return;
  }
  mediaRecorder.ondataavailable = (ev) => {
    if (ev.data && ev.data.size > 0) recordChunks.push(ev.data);
  };
  mediaRecorder.onstop = () => {
    const type = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(recordChunks, { type });
    const ext = type.includes('ogg') ? 'ogg' : 'webm';
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('downloadLink');
    a.href = url;
    a.download = `pendoleum-${Date.now()}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 30_000);
    const btn = document.getElementById('recBtn');
    btn.textContent = 'Record';
    btn.classList.remove('recording');
    isRecording = false;
    setStatus(`Saved recording (${(blob.size / 1024).toFixed(0)} KB) — check your downloads`);
  };
  mediaRecorder.start(250);
  isRecording = true;
  const btn = document.getElementById('recBtn');
  btn.textContent = 'Stop & Save';
  btn.classList.add('recording');
  setStatus('Recording… click Stop & Save to download');
}

function stopRecording(discard) {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    isRecording = false;
    return;
  }
  if (discard) {
    mediaRecorder.onstop = () => {
      recordChunks = [];
      isRecording = false;
      const btn = document.getElementById('recBtn');
      btn.textContent = 'Record';
      btn.classList.remove('recording');
    };
  }
  try { mediaRecorder.stop(); } catch (e) {}
  if (!discard) {
    // onstop handles download
  }
  isRecording = false;
  const btn = document.getElementById('recBtn');
  btn.textContent = 'Record';
  btn.classList.remove('recording');
}

async function enableMIDI() {
  if (!navigator.requestMIDIAccess) {
    document.getElementById('status').textContent = 'Web MIDI not available in this browser';
    return;
  }
  try {
    midiAccess = await navigator.requestMIDIAccess();
    const select = document.getElementById('midiOut');
    select.innerHTML = '';
    for (let out of midiAccess.outputs.values()) {
      const opt = document.createElement('option');
      opt.value = out.id;
      opt.textContent = out.name;
      select.appendChild(opt);
    }
    if (select.options.length) {
      midiOutput = midiAccess.outputs.get(select.value);
      select.onchange = () => midiOutput = midiAccess.outputs.get(select.value);
      document.getElementById('midiBtn').textContent = 'MIDI On';
      document.getElementById('status').textContent = 'MIDI ready – connect a synth or DAW';
    } else {
      midiOutput = null;
      document.getElementById('status').textContent = 'MIDI access OK but no output devices found';
    }
  } catch(e) {
    midiOutput = null;
    document.getElementById('status').textContent = 'MIDI not available in this browser';
  }
}

function freqToMidiFromHz(hz) {
  if (!(hz > 0)) return 60;
  return Math.max(0, Math.min(127, Math.round(69 + 12 * Math.log2(hz / 440))));
}

function freqToMidi(f) {
  // map relative physics unit → audible Hz → MIDI note number
  const hz = AUDIO_BASE_HZ * (f / REL_UNIT);
  return freqToMidiFromHz(hz);
}

function sendMIDINote(note, vel=90, dur=180) {
  if (!midiOutput) return;
  const ch = 0;
  midiOutput.send([0x90|ch, note, vel]);
  setTimeout(() => midiOutput.send([0x80|ch, note, 0]), dur);
}

function restart() {
  const useJI = document.getElementById('jiToggle').checked;

  layers.forEach((layer, li) => {
    if (layer.key == null) layer.key = 'C';
    if (layer.octave == null) layer.octave = 0;
    if (layer.speed == null) layer.speed = '1/4';
    if (layer.order == null) layer.order = 'asc';
    if (layer.notes == null) layer.notes = defaultNotesFromUI();
    layer.speed = speedId(layer.speed);
    layer.notes = Math.max(1, Math.min(12, +layer.notes || 1));
    const n = layer.notes;
    (layer.pendulums || []).forEach(stopPendulumAudio);
    const plan = getFreqPlan(layer.mode, n, useJI, layer.key, layer.octave, layer.speed, layer.order);
    layer.weights = plan.weights;
    const spdF = speedFactor(layer.speed);
    layer.pendulums = plan.rel.map((f, i) => {
      // Visual length from weight only (not pitchMul) so high keys don’t collapse the fan
      const w = plan.weights[i];
      const minW = Math.min(...plan.weights);
      const fVis = (w / minW) * REL_UNIT;
      const p = {
        f, // includes key/octave for pitch + omega base
        fVis,
        weight: w,
        pitchMul: plan.pitchMul,
        speed: plan.layerSpeed,
        speedFactor: spdF,
        length: 155 / (fVis * fVis),
        angle: 0.5,
        trail: [],
        hue: modeColors[li % modeColors.length][0] + i * (modeColors[li % modeColors.length][1] / Math.max(n, 1)),
        lastPeak: 0,
        osc: null,
        gain: null
      };
      if (isAudioOn && audioCtx && audioCtx.state !== 'closed') {
        wirePendulumOsc(p);
      }
      return p;
    });
  });
  time = 0;
  const summary = layers.map(l => {
    const spd = speedId(l.speed);
    const oct = l.octave || 0;
    const octS = oct >= 0 ? `+${oct}` : `${oct}`;
    const ord = l.order === 'desc' ? '↓' : '↑';
    return `${l.mode}@${l.key || 'C'}${octS}×${spd}${ord}${l.notes}n`;
  }).join(' + ');
  setStatus(summary + (useJI ? ' (JI)' : ' (ET)') + (isAudioOn ? ' · sound on' : isPaused ? ' · stopped/paused' : ''));
}

// ——— Genetic Algorithm ———
function randomScale(size=6) {
  const s = [1];
  for (let i=1;i<size;i++) s.push(1 + Math.random()*0.95);
  return s.sort((a,b)=>a-b);
}
function fitness(scale) {
  let score = 0;
  const targets = [1.25, 1.333, 1.5, 1.666, 1.875, 1.2, 1.4, 1.6];
  for (let i=0;i<scale.length;i++) {
    for (let j=i+1;j<scale.length;j++) {
      const r = scale[j]/scale[i];
      targets.forEach(t => { if (Math.abs(r-t)<0.03) score += 3; });
      if (Math.abs(r-1.5)<0.02) score += 4; // perfect fifth bonus
    }
  }
  score += scale.length * 0.4; // slight preference for more notes
  score -= Math.abs(scale.length-7)*0.8;
  return score;
}
function mutate(scale) {
  const s = scale.slice();
  if (Math.random()<0.4 && s.length>4) s.splice(1+Math.floor(Math.random()*(s.length-2)),1);
  else if (Math.random()<0.35 && s.length<9) s.push(1+Math.random()*0.95);
  else {
    const idx = 1 + Math.floor(Math.random()*(s.length-1));
    s[idx] *= 0.94 + Math.random()*0.12;
  }
  return [...new Set(s.map(x=>Math.round(x*1000)/1000))].sort((a,b)=>a-b);
}
function crossover(a,b) {
  const cut = 1 + Math.floor(Math.random()*(Math.min(a.length,b.length)-1));
  return [...new Set(a.slice(0,cut).concat(b.slice(cut)))].sort((a,b)=>a-b);
}
function evolveOnce() {
  if (population.length < 8) {
    population = Array.from({length:20}, () => randomScale(5+Math.floor(Math.random()*4)));
  }
  // one generation
  population.sort((a,b)=>fitness(b)-fitness(a));
  const next = population.slice(0,6);
  while (next.length < 20) {
    const p1 = population[Math.floor(Math.random()*8)];
    const p2 = population[Math.floor(Math.random()*8)];
    next.push(mutate(crossover(p1,p2)));
  }
  population = next;
  const best = population[0];
  const name = 'gen_' + Date.now().toString().slice(-5);
  const loaded = injectModeAsLayer(name, best);
  createLayerUI();
  restart();
  if (loaded) {
    document.getElementById('status').textContent = `Evolved “${name}”  fitness ${fitness(best).toFixed(1)}  → loaded as new layer`;
  } else {
    document.getElementById('status').textContent = `Evolved “${name}”  fitness ${fitness(best).toFixed(1)}  → saved (layer cap ${MAX_LAYERS}; remove a layer to load)`;
  }
}

function cancelBreed() {
  if (!breedRunning) return;
  breedCancel = true;
  setStatus('Cancelling breeding…');
}

async function overnightBreed() {
  if (breedRunning) return;
  const gens = +document.getElementById('gens').value || 40;
  breedRunning = true;
  breedCancel = false;
  document.getElementById('breedBtn').style.display = 'none';
  document.getElementById('cancelBreedBtn').style.display = '';
  if (population.length < 8) population = Array.from({length:24}, () => randomScale(6));

  const chunk = 5;
  for (let g = 0; g < gens; g++) {
    if (breedCancel) break;
    population.sort((a,b)=>fitness(b)-fitness(a));
    const elite = population.slice(0,5);
    const next = [...elite];
    while (next.length < 24) {
      const p1 = population[Math.floor(Math.random()*10)];
      const p2 = population[Math.floor(Math.random()*10)];
      next.push(Math.random()<0.7 ? mutate(crossover(p1,p2)) : mutate(p1));
    }
    population = next;
    if (g % chunk === 0 || g === gens - 1) {
      setStatus(`Breeding… gen ${g + 1}/${gens}`);
      await new Promise(r => setTimeout(r, 0)); // yield so Cancel works
    }
  }

  document.getElementById('breedBtn').style.display = '';
  document.getElementById('cancelBreedBtn').style.display = 'none';
  breedRunning = false;

  if (breedCancel) {
    breedCancel = false;
    setStatus('Breeding cancelled');
    return;
  }

  // inject top 2 into free slots only
  let loaded = 0;
  let savedOnly = 0;
  for (let i=0;i<2;i++) {
    const best = population[i];
    const name = 'night_' + (Date.now()+i).toString().slice(-5);
    if (injectModeAsLayer(name, best)) loaded++;
    else savedOnly++;
  }
  createLayerUI();
  restart();
  if (savedOnly === 0) {
    setStatus(`Overnight breeding complete (${gens} gens). Top two offspring loaded.`);
  } else if (loaded === 0) {
    setStatus(`Overnight breeding complete (${gens} gens). Modes saved; layer cap ${MAX_LAYERS} — remove a layer to load.`);
  } else {
    setStatus(`Overnight breeding complete (${gens} gens). Loaded ${loaded}, saved without layer ${savedOnly} (cap ${MAX_LAYERS}).`);
  }
}

function draw() {
  ctx.fillStyle = 'rgba(10,10,20,0.2)';
  ctx.fillRect(0,0,W,H);
  const pivotX = W/2, pivotY = 65;

  ctx.strokeStyle = 'rgba(160,160,255,0.07)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pivotX-300, pivotY+460);
  ctx.lineTo(pivotX, pivotY);
  ctx.lineTo(pivotX+300, pivotY+460);
  ctx.stroke();

  layers.forEach((layer, li) => {
    const layerSpeed = speedFactor(layer.speed); // rational, e.g. 1/8 … 8
    layer.pendulums.forEach((p, i) => {
      // Rational layer speed multiplies swing rate; fVis keeps relative integer ratios
      const baseF = p.fVis != null ? p.fVis : p.f;
      const omega = 2 * Math.PI * baseF * layerSpeed;
      const prevAngle = p.angle;
      if (!isPaused) {
        p.angle = 0.50 * Math.cos(omega * time + li * 0.35);
      }

      // Peak spacing scales with speed so slow rates don't re-trigger mid-swing
      const minPeakGap = 0.35 / Math.max(layerSpeed, 0.05);
      if (!isPaused && Math.abs(p.angle) > 0.47 && Math.abs(prevAngle) <= 0.47 && time - p.lastPeak > minPeakGap) {
        p.lastPeak = time;
        // Longer MIDI notes when slow so each degree is hearable
        const noteDur = Math.min(1200, Math.max(140, 180 / Math.max(layerSpeed, 0.1)));
        if (midiOutput) sendMIDINote(freqToMidi(p.f), 75 + Math.random()*40, noteDur);
      }

      const x = pivotX + p.length * Math.sin(p.angle);
      const y = pivotY + p.length * Math.cos(p.angle);

      if (!isPaused) {
        p.trail.push({x,y});
        if (p.trail.length > 32) p.trail.shift();
      }

      ctx.beginPath();
      ctx.strokeStyle = `hsla(${p.hue},75%,65%,0.5)`;
      ctx.lineWidth = 1.6;
      for (let j=1;j<p.trail.length;j++) {
        ctx.moveTo(p.trail[j-1].x, p.trail[j-1].y);
        ctx.lineTo(p.trail[j].x, p.trail[j].y);
      }
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = `hsla(${p.hue},40%,70%,0.2)`;
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = `hsl(${p.hue},80%,60%)`;
      ctx.arc(x, y, 6.5, 0, Math.PI*2);
      ctx.fill();

      if (p.gain && audioCtx && isAudioOn) {
        const energy = isPaused ? 0 : Math.pow(Math.abs(Math.sin(p.angle*1.7)), 1.4);
        p.gain.gain.setTargetAtTime(energy * VOICE_PEAK, audioCtx.currentTime, 0.04);
      }
    });
  });

  if (!isPaused) time += 0.0152;
  requestAnimationFrame(draw);
}

// boot
addLayer();
addLayer();
createLayerUI();
restart();
draw();
</script>
